<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1b2468; --bg2:#080b24; --ink:#eaedff; --dim:#9aa4d8;
  --jade:#3ef0c2; --amber:#ffb02e; --danger:#ff5470;
  --glass:rgba(16,22,64,.58); --line:rgba(160,175,255,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 20%,var(--bg1),var(--bg2) 70%);
  -webkit-user-select:none;user-select:none;touch-action:none;
}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#hud{
  position:fixed;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0;pointer-events:none;
}
#hud>*{pointer-events:auto}
.brand{font-weight:800;font-size:1.7rem;letter-spacing:-.03em;
  background:linear-gradient(90deg,var(--jade),#5aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:10px}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 16px;min-width:84px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat b{display:block;font-size:1.6rem;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--dim)}
.stat.pop b{animation:pop .28s ease-out}
@keyframes pop{40%{transform:scale(1.25);color:var(--amber)}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--jade);outline-offset:3px}
.brand span{font-size:.72rem;margin-left:4px;vertical-align:super;letter-spacing:0}
.tools{display:flex;gap:8px;justify-self:end}
.icon{height:42px;min-width:42px;display:grid;place-items:center;border-radius:14px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,transform .15s}
.icon:hover{border-color:var(--jade)}
.icon:active{transform:scale(.94)}
.icon.text{padding:0 14px;font-size:.9rem}
.icon svg{width:20px;height:20px;fill:currentColor}
#pauseBtn .play,#pauseBtn.paused .bars{display:none}
#pauseBtn.paused .play{display:block}
#muteBtn .slash{display:none}
#muteBtn.muted .slash{display:block}
#muteBtn.muted{color:var(--danger)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(2,4,20,.6))}
#level{grid-column:1/-1;justify-self:center;display:flex;align-items:center;gap:10px;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:700;white-space:nowrap;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#level i{display:block;width:120px;height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
#level u{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--jade),var(--amber));transition:width .3s}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:2.1rem;letter-spacing:-.02em;opacity:0;pointer-events:none;
  text-shadow:0 4px 30px rgba(0,0,0,.55);white-space:nowrap}
#toast.show{animation:toast 1.5s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
.float{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:1.3rem;color:var(--amber);pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,.6);animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translate(-50%,-200%);opacity:0}}
kbd{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:rgba(255,255,255,.08);
  border:1px solid var(--line);border-bottom-width:3px;font:inherit;font-weight:700;font-size:.9rem;color:var(--ink)}
.keys{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:0 0 22px;color:var(--dim);font-size:.9rem}
.keys em{font-style:normal;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 22px}
.tile{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:12px}
.tile b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--dim)}
.badge{display:inline-block;background:linear-gradient(135deg,var(--amber),#ff7a45);color:#3a1d00;font-weight:800;font-size:.8rem;
  border-radius:999px;padding:4px 12px;margin:0 0 14px}
#cHint{display:block;margin-top:14px;color:var(--dim);font-size:.85rem}
@media (pointer:coarse){#cHint{display:none}}
#card{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 36px));
  background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:30px 28px 28px;text-align:center;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 24px 70px rgba(0,0,0,.45);
  transition:opacity .25s,transform .25s;
}
#card.off{opacity:0;pointer-events:none;transform:translate(-50%,-46%)}
#card h1{margin:0 0 8px;font-size:2.4rem;font-weight:800;letter-spacing:-.03em}
#card p{margin:0 0 22px;color:var(--dim);line-height:1.5;font-size:1rem}
#cBtn{border:0;border-radius:16px;padding:14px 34px;font-weight:700;font-size:1.1rem;color:#052a22;
  background:linear-gradient(135deg,var(--jade),#7dd3ff);box-shadow:0 8px 26px rgba(62,240,194,.35);transition:transform .15s}
#cBtn:hover{transform:translateY(-2px)}
#cBtn:active{transform:scale(.97)}
#pad{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:none;grid-template-areas:". u ." "l . r" ". d .";gap:8px}
#pad button{width:64px;height:64px;border-radius:20px;border:1px solid var(--line);background:var(--glass);font-size:1.4rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#pad button:active{background:rgba(62,240,194,.35)}
@media (pointer:coarse){#pad{display:grid}}
#card{max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto}
#legend{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:20px;
  color:var(--dim);font-size:.85rem;white-space:nowrap;pointer-events:none;opacity:.85}
#legend kbd{min-width:26px;height:26px;font-size:.75rem;margin-right:3px}
@media (pointer:coarse){#legend{display:none}.icon{height:46px;min-width:46px}#pad button{width:68px;height:68px}}
@media (min-width:1200px){.brand{font-size:2.1rem}.stat{padding:10px 22px}.stat b{font-size:1.9rem}#level{font-size:.95rem}}
@media (max-width:720px){#hud{grid-template-columns:1fr auto;row-gap:10px}.stats{grid-column:1/-1;grid-row:2;justify-self:center}.tools{grid-column:2;grid-row:1}#level{grid-row:3}}
@media (max-width:420px){.icon.text{padding:0 10px;font-size:.8rem}.tools{gap:6px}}
@media (pointer:coarse) and (orientation:landscape) and (max-height:520px){
  #hud{grid-template-columns:1fr auto 1fr;row-gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px))}
  .brand{font-size:1.25rem}
  .stats{grid-column:auto;grid-row:auto;justify-self:auto}
  .tools{grid-column:auto;grid-row:auto}
  .stat{padding:4px 12px;min-width:64px;border-radius:12px}.stat b{font-size:1.2rem}
  #level{grid-row:2;padding:3px 12px}
  #pad{left:auto;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:none}
  #pad button{width:56px;height:56px;border-radius:16px}
  #card{padding:18px 22px}#card h1{font-size:1.7rem;margin-bottom:4px}#card p,.keys,.tiles{margin-bottom:12px}.tile{padding:8px}
}
@media (max-width:520px){.brand{font-size:1.3rem}.stat{min-width:68px;padding:6px 12px}.stat b{font-size:1.3rem}}
</style>
</head>
<body>
<div id="stage"></div>

<div id="vig"></div>

<div id="hud">
  <div class="brand">snake<span>3D</span></div>
  <div class="stats">
    <div class="stat" id="scoreBox"><b id="score">0</b><span>Score</span></div>
    <div class="stat"><b id="best">0</b><span>Best</span></div>
    <div class="stat"><b id="len">4</b><span>Length</span></div>
  </div>
  <div class="tools">
    <button class="icon" id="pauseBtn" aria-label="Pause or resume">
      <svg class="bars" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      <svg class="play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10-6.5a1 1 0 0 0 0-1.72l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <button class="icon" id="muteBtn" aria-label="Mute or unmute sound">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/><path class="slash" d="M3.3 2.3 2 3.6l18.4 18.4 1.3-1.3z"/></svg>
    </button>
    <button class="icon text" id="view" aria-label="Switch camera view">Top view</button>
  </div>
  <div id="level"><span id="lvl">Level 1</span><i><u id="lvlBar"></u></i></div>
</div>

<div id="toast"></div>
<div id="floaters"></div>

<div id="card" role="dialog" aria-live="polite">
  <h1 id="cTitle">Snake 3D</h1>
  <p id="cText">Eat the amber fruit to grow. Avoid the walls and your own tail.</p>
  <div id="cExtra"><div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><em>or arrow keys, swipe on touch</em></div></div>
  <button id="cBtn">Start game</button>
  <small id="cHint">Press Space to start</small>
</div>

<div id="legend">
  <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
  <span><kbd>P</kbd> pause</span><span><kbd>M</kbd> sound</span><span><kbd>V</kbd> view</span>
</div>

<div id="pad">
  <button style="grid-area:u" data-d="up" aria-label="Up">▲</button>
  <button style="grid-area:l" data-d="left" aria-label="Left">◄</button>
  <button style="grid-area:r" data-d="right" aria-label="Right">►</button>
  <button style="grid-area:d" data-d="down" aria-label="Down">▼</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const N = 20, HALF = (N - 1) / 2;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(pointer: coarse)').matches;
  const $ = id => document.getElementById(id);
  const wx = x => x - HALF, wz = y => y - HALF;

  // ---------- Scene ----------
  const stage = $('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 1.75 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xaab8ff, 0x1a1040, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(7, 15, 9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(touch ? 1024 : 2048, touch ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 40 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // Board
  const c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d');
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    g.fillStyle = (x + y) % 2 ? '#26337a' : '#2d3b8c'; g.fillRect(x, y, 1, 1);
  }
  const tex = new THREE.CanvasTexture(c); tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(N, N), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = 0.001; floor.receiveShadow = true; scene.add(floor);

  const slab = new THREE.Mesh(new THREE.BoxGeometry(N + 0.9, 1.2, N + 0.9), new THREE.MeshStandardMaterial({ color: 0x121a52, roughness: 0.6 }));
  slab.position.y = -0.6; slab.receiveShadow = true; scene.add(slab);
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x5b6cff, emissive: 0x2a38c8, emissiveIntensity: 0.55, roughness: 0.4 });
  const off = N / 2 + 0.2;
  [[N + 0.9, 0.3, 0.4, 0, -off], [N + 0.9, 0.3, 0.4, 0, off], [0.4, 0.3, N + 0.9, -off, 0], [0.4, 0.3, N + 0.9, off, 0]].forEach(([w, h, d, x, z]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat); m.position.set(x, h / 2, z); m.castShadow = true; scene.add(m);
  });

  // Snake meshes
  const bodyGeo = new THREE.SphereGeometry(0.5, 24, 18);
  const bodies = [];
  const head = new THREE.Group();
  const headMat = new THREE.MeshStandardMaterial({ color: 0x3ef0c2, roughness: 0.3, metalness: 0.1 });
  const headBall = new THREE.Mesh(new THREE.SphereGeometry(0.58, 32, 24), headMat);
  headBall.scale.set(1.1, 0.95, 1); headBall.castShadow = true; head.add(headBall);
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }));
    eye.position.set(0.3, 0.24, 0.3 * s); head.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), new THREE.MeshBasicMaterial({ color: 0x0a0f30 }));
    pupil.position.set(0.43, 0.25, 0.3 * s); head.add(pupil);
  });
  scene.add(head);

  // Food
  const food = new THREE.Group();
  const fruit = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 18), new THREE.MeshStandardMaterial({ color: 0xffb02e, emissive: 0xff7a00, emissiveIntensity: 0.7, roughness: 0.25 }));
  fruit.castShadow = true; food.add(fruit);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8), new THREE.MeshStandardMaterial({ color: 0x3ef0c2, roughness: 0.4 }));
  leaf.scale.set(1.6, 0.4, 0.8); leaf.position.set(0.14, 0.42, 0); leaf.rotation.z = 0.5; food.add(leaf);
  const glow = new THREE.PointLight(0xffa020, 1.4, 7); glow.position.y = 0.6; food.add(glow);
  scene.add(food);

  // Particles
  const parts = [];
  const pGeo = new THREE.SphereGeometry(0.09, 8, 6);
  function burst(x, z, color) {
    for (let i = 0; i < 16; i++) {
      const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
      m.position.set(x, 0.6, z);
      const a = Math.random() * 6.283, s = 1.5 + Math.random() * 2.5;
      parts.push({ m, vx: Math.cos(a) * s, vz: Math.sin(a) * s, vy: 2 + Math.random() * 3, life: 1 });
      scene.add(m);
    }
  }

  // ---------- Game state ----------
  let snake, prev, dir, queue, foodPos, score, foods, tickMs, acc, state = 'idle';
  let best = 0; try { best = +localStorage.getItem('snakeBest3d') || 0; } catch (e) {}
  $('best').textContent = best;
  let deadT = 0, headAngle = 0, foodScale = 0, camA = 0, camR = 15, camH = 17, topView = false;
  let phase = 0, shownHue = 265, flash = 0, bgTick = 0, newBest = false;
  const look = new THREE.Vector3();
  const hudScore = $('score'), box = $('scoreBox'), lenEl = $('len'), lvlEl = $('lvl'), bar = $('lvlBar');
  const level = () => Math.floor(foods / 4) + 1;
  function updateHud() { lenEl.textContent = snake.length; lvlEl.textContent = 'Level ' + level(); bar.style.width = (foods % 4) * 25 + '%'; }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    prev = snake.map(s => ({ ...s }));
    dir = 'right'; queue = []; score = 0; foods = 0; tickMs = 130; acc = 0; deadT = 0;
    hudScore.textContent = 0; updateHud();
    placeFood(); foodScale = 0;
    ensureMeshes(); colorSnake(0);
  }
  function placeFood() {
    do { foodPos = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 }; }
    while (snake.some(s => s.x === foodPos.x && s.y === foodPos.y));
  }
  function ensureMeshes() {
    while (bodies.length < snake.length - 1) {
      const m = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.1 }));
      m.castShadow = true; scene.add(m); bodies.push(m);
    }
    bodies.forEach((m, i) => m.visible = i < snake.length - 1);
  }
  const cA = new THREE.Color(0x3ef0c2), cB = new THREE.Color(0x2f6bff), cDead = new THREE.Color(0xff5470), tmp = new THREE.Color();
  function colorSnake(dead) {
    const n = snake.length;
    tmp.copy(cA).lerp(cDead, dead); headMat.color.copy(tmp);
    bodies.forEach((m, i) => { m.material.color.copy(cA).lerp(cB, Math.min(1, (i + 1) / Math.max(n - 1, 8))).lerp(cDead, dead); });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    const h = { x: snake[0].x + dx, y: snake[0].y + dy };
    const eat = h.x === foodPos.x && h.y === foodPos.y;
    const solid = eat ? snake : snake.slice(0, -1);
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || solid.some(s => s.x === h.x && s.y === h.y)) return die();
    const old = snake.map(s => ({ ...s }));
    snake.unshift(h); if (!eat) snake.pop();
    prev = snake.map((s, i) => old[Math.min(i, old.length - 1)]);
    if (eat) {
      score += 10; foods++; flash = 1; hudScore.textContent = score;
      box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
      burst(wx(foodPos.x), wz(foodPos.y), 0xffb02e); beep(660, .09);
      tickMs = Math.max(75, 130 - Math.floor(foods / 4) * 5);
      floatText(wx(foodPos.x), wz(foodPos.y), '+10'); updateHud();
      if (foods % 4 === 0) { toast('Level ' + level() + ', faster!'); beep(880, .12); }
      placeFood(); foodScale = 0; ensureMeshes(); colorSnake(0);
    }
  }
  function die() {
    state = 'dead'; deadT = 0; beep(150, .35, 'sawtooth');
    burst(wx(snake[0].x), wz(snake[0].y), 0xff5470);
    newBest = score > best && score > 0;
    if (newBest) { best = score; $('best').textContent = best; try { localStorage.setItem('snakeBest3d', best); } catch (e) {} }
  }

  // ---------- UI ----------
  const card = $('card');
  function showCard(title, text, btn, extra = '', hint = '') {
    $('cTitle').textContent = title; $('cText').innerHTML = text; $('cExtra').innerHTML = extra; $('cHint').textContent = hint;
    $('cBtn').textContent = btn; card.classList.remove('off'); $('cBtn').focus({ preventScroll: true });
  }
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }
  function floatText(x, z, txt) {
    const v = new THREE.Vector3(x, 0.9, z).project(camera), el = document.createElement('div');
    el.className = 'float'; el.textContent = txt;
    el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    $('floaters').appendChild(el); setTimeout(() => el.remove(), 900);
  }
  function start() { reset(); state = 'play'; card.classList.add('off'); $('cBtn').blur(); beep(440, .08); }
  function togglePause() {
    if (state === 'play') { state = 'pause'; showCard('Paused', 'Take a breath. Your snake is waiting.', 'Resume', '', 'Press P to resume'); }
    else if (state === 'pause') { state = 'play'; card.classList.add('off'); }
    $('pauseBtn').classList.toggle('paused', state === 'pause');
  }
  $('cBtn').onclick = () => state === 'pause' ? togglePause() : start();
  function turn(d) {
    if (state !== 'play') return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d === last || d === OPP[last]) return;
    if (queue.length < 2) queue.push(d);
  }
  const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
  addEventListener('keydown', e => {
    const d = keys[e.key] || keys[e.key.toLowerCase()];
    if (d) { e.preventDefault(); turn(d); }
    else if ((e.key === ' ' || e.key === 'Enter') && (state === 'idle' || state === 'over')) { e.preventDefault(); start(); }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
    else if (e.key === 'm' || e.key === 'M') toggleMute();
    else if (e.key === 'v' || e.key === 'V') toggleView();
  });
  document.querySelectorAll('#pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.d); }));
  let tx = 0, ty = 0;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }, { passive: true });
  function toggleView() { topView = !topView; $('view').textContent = topView ? 'Angled view' : 'Top view'; }
  $('view').onclick = toggleView;
  function toggleMute() { muted = !muted; $('muteBtn').classList.toggle('muted', muted); }
  $('muteBtn').onclick = toggleMute;
  $('pauseBtn').onclick = e => { togglePause(); e.currentTarget.blur(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  let actx;
  let muted = false;
  function beep(f, d, type = 'sine') {
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), v = actx.createGain();
      o.type = type; o.frequency.value = f; v.gain.setValueAtTime(.06, actx.currentTime);
      v.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d);
      o.connect(v); v.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
    } catch (e) {}
  }

  // ---------- Loop ----------
  // Fit the board into the space left between the top bar and the bottom controls
  let viewH = 1, freeH = 1;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const top = $('hud').getBoundingClientRect().bottom + 6;
    let bottom = h;
    [$('pad'), $('legend')].forEach(el => {
      if (getComputedStyle(el).display === 'none') return;
      const r = el.getBoundingClientRect(), mid = r.left + r.width / 2;
      if (mid > w * 0.3 && mid < w * 0.7) bottom = Math.min(bottom, r.top - 6);
    });
    viewH = h; freeH = Math.max(160, bottom - top);
    camera.setViewOffset(w, h, 0, h / 2 - (top + bottom) / 2, w, h);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 250));
  addEventListener('load', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('hud'));
  resize();

  const lerp = (a, b, t) => a + (b - a) * t;
  let last = performance.now(), time = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now; time += dt;

    if (state === 'play') { acc += dt * 1000; while (acc >= tickMs && state === 'play') { acc -= tickMs; step(); } }
    const t = state === 'play' || state === 'pause' ? Math.min(1, acc / tickMs) : 1;

    // snake
    const n = snake.length;
    const pos = i => ({ x: wx(lerp(prev[i].x, snake[i].x, t)), z: wz(lerp(prev[i].y, snake[i].y, t)) });
    const hp = pos(0);
    head.position.set(hp.x, 0.55, hp.z);
    const [dx, dy] = DIRS[state === 'play' && queue.length === 0 ? dir : dir];
    let target = Math.atan2(-dy, dx), diff = ((target - headAngle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    headAngle += diff * Math.min(1, dt * 14); head.rotation.y = headAngle;
    for (let i = 1; i < n; i++) {
      const p = pos(i), s = Math.max(0.62, 0.95 - 0.33 * (i / n));
      const m = bodies[i - 1]; m.position.set(p.x, 0.5 * s, p.z); m.scale.setScalar(s * 0.96);
    }

    // food
    foodScale = Math.min(1, foodScale + dt * 4);
    food.position.set(wx(foodPos.x), 0.55 + Math.sin(time * 3) * 0.08, wz(foodPos.y));
    food.scale.setScalar(foodScale * (1 + Math.sin(time * 5) * 0.03));
    fruit.rotation.y = time * 1.5;

    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt * 1.6; p.vy -= 12 * dt;
      p.m.position.x += p.vx * dt; p.m.position.z += p.vz * dt; p.m.position.y = Math.max(0.1, p.m.position.y + p.vy * dt);
      p.m.material.opacity = Math.max(0, p.life);
      if (p.life <= 0) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
    }

    // death
    if (state === 'dead') {
      deadT += dt; colorSnake(Math.min(1, deadT * 4));
      if (deadT > 0.7) { state = 'over'; showCard('Game over', newBest ? 'A new personal best. Nicely done.' : 'So close. One more try?', 'Play again',
        `${newBest ? '<div class="badge">New best</div>' : ''}<div class="tiles"><div class="tile"><b>${score}</b><span>Score</span></div><div class="tile"><b>${best}</b><span>Best</span></div><div class="tile"><b>${snake.length}</b><span>Length</span></div><div class="tile"><b>${level()}</b><span>Level</span></div></div>`,
        'Press Space to play again'); }
    }

    // camera
    const idle = state === 'idle' || state === 'over';
    if (idle && !reduce) camA += dt * 0.18;
    else camA += (Math.round(camA / 6.2832) * 6.2832 - camA) * Math.min(1, dt * 3);
    const spanV = topView ? 20.7 : 17.4, fill = topView ? 0.98 : 0.86;
    const kV = fill * viewH / freeH * 1.06, kH = 21.5 / (spanV * camera.aspect);
    const k = Math.min(2.9, Math.max(1, kV, kH));
    const tR = topView ? 3 : 15, tH = topView ? 27 : 17;
    camR = lerp(camR, tR * k, Math.min(1, dt * 4)); camH = lerp(camH, tH * k, Math.min(1, dt * 4));
    camera.position.set(Math.sin(camA) * camR, camH, Math.cos(camA) * camR);
    if (state === 'dead' && !reduce && deadT < 0.5) camera.position.x += (Math.random() - 0.5) * 0.4 * (1 - deadT * 2);
    look.x = lerp(look.x, hp.x * 0.14, Math.min(1, dt * 3)); look.z = lerp(look.z, hp.z * 0.14 + 0.8, Math.min(1, dt * 3));
    camera.lookAt(look);

    // animated gradient background: drifts through blue, violet and magenta,
    // cycles faster as the snake speeds up, pulses on every fruit, turns red on a crash
    const heat = state === 'play' ? (130 - tickMs) / 55 : 0;
    phase += dt * (reduce ? 0.05 : 0.25 + heat * 0.9);
    flash = Math.max(0, flash - dt * 2.5);
    const dying = state === 'dead' || state === 'over';
    shownHue += ((dying ? 355 : 265 + Math.sin(phase) * 65) - shownHue) * Math.min(1, dt * 4);
    if ((bgTick++ & 1) === 0) {
      const h = shownHue, ang = 160 + Math.sin(phase * 0.7) * 50, lift = flash * 14;
      document.body.style.background =
        `radial-gradient(65% 55% at 50% 58%, hsla(${h + 30},85%,${45 + lift}%,${0.3 + flash * 0.25}), transparent 72%),` +
        `linear-gradient(${ang}deg, hsl(${h},68%,${17 + lift / 2}%), hsl(${h + 55},62%,9%) 55%, hsl(${h + 120},64%,${14 + lift / 2}%))`;
      wallMat.emissive.setHSL(h / 360, 0.8, 0.3 + flash * 0.15);
    }

    renderer.render(scene, camera);
  }

  if (touch) $('cExtra').innerHTML = '<div class="keys"><em>Swipe anywhere or use the buttons to steer</em></div>';
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
